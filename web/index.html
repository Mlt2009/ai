<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Atlas — AI Companion</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>
<div id="app">
  <header>
    <div class="orb" id="orb"></div>
    <div>
      <h1>Atlas</h1>
      <div id="status" class="status">connecting…</div>
    </div>
    <button id="reset" title="New conversation">⟳</button>
  </header>

  <section id="tiles">
    <div class="tile"><span class="tile-label">CPU</span><span class="tile-value" id="t-cpu">–</span></div>
    <div class="tile"><span class="tile-label">RAM</span><span class="tile-value" id="t-mem">–</span></div>
    <div class="tile"><span class="tile-label">Home</span><span class="tile-value" id="t-home">–</span></div>
    <div class="tile"><span class="tile-label">Printer</span><span class="tile-value" id="t-printer">–</span></div>
  </section>

  <main id="chat"></main>

  <footer>
    <button id="mic" class="mic" title="Hold or tap to talk">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
      </svg>
    </button>
    <input id="input" type="text" placeholder="Type or tap the mic…" autocomplete="off">
    <button id="send" title="Send">➤</button>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
