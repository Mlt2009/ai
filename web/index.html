<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Atlas — AI Companion</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>
<div id="app">
  <header>
    <div class="orb" id="orb"></div>
    <div>
      <h1>Atlas</h1>
      <div id="status" class="status">connecting…</div>
    </div>
    <button id="settings-btn" title="Settings">⚙</button>
    <button id="reset" title="New conversation">⟳</button>
  </header>

  <div id="settings" class="settings hidden">
    <div class="settings-card">
      <h2>Power up your agents</h2>
      <p class="hint">Paste your keys — each service lights up green when it connects. Keys are stored only on your own server (.env).</p>

      <div class="svc" data-svc="gemini">
        <div class="svc-head"><span class="dot"></span><strong>Gemini brain</strong><span class="svc-detail"></span></div>
        <input data-key="GEMINI_API_KEY" placeholder="GEMINI_API_KEY — aistudio.google.com/apikey" autocomplete="off">
      </div>

      <div class="svc" data-svc="home_assistant">
        <div class="svc-head"><span class="dot"></span><strong>Home Assistant</strong><span class="svc-detail"></span></div>
        <input data-key="HA_URL" placeholder="HA_URL, e.g. http://homeassistant.local:8123" autocomplete="off">
        <input data-key="HA_TOKEN" placeholder="HA_TOKEN — HA profile → Security → long-lived token" autocomplete="off">
      </div>

      <div class="svc" data-svc="octoprint">
        <div class="svc-head"><span class="dot"></span><strong>3D printer (OctoPrint)</strong><span class="svc-detail"></span></div>
        <input data-key="OCTOPRINT_URL" placeholder="OCTOPRINT_URL, e.g. http://octopi.local" autocomplete="off">
        <input data-key="OCTOPRINT_API_KEY" placeholder="OCTOPRINT_API_KEY" autocomplete="off">
      </div>

      <div class="svc" data-svc="cups">
        <div class="svc-head"><span class="dot"></span><strong>Paper printer</strong><span class="svc-detail"></span></div>
        <input data-key="CUPS_PRINTER" placeholder="Printer name (blank = system default)" autocomplete="off">
      </div>

      <div class="svc" data-svc="computer">
        <div class="svc-head"><span class="dot"></span><strong>Computer control</strong><span class="svc-detail"></span></div>
        <label class="toggle"><input type="checkbox" data-key="ALLOW_SHELL"> Allow shell commands (full power — use with care)</label>
      </div>

      <div class="svc" data-svc="data">
        <div class="svc-head"><span class="dot"></span><strong>Real-time data</strong><span class="svc-detail"></span></div>
      </div>

      <div class="settings-actions">
        <button id="settings-save">Save &amp; connect</button>
        <button id="settings-close" class="ghost">Close</button>
      </div>
      <p id="settings-msg" class="hint"></p>
    </div>
  </div>

  <section id="tiles">
    <div class="tile"><span class="tile-label">CPU</span><span class="tile-value" id="t-cpu">–</span></div>
    <div class="tile"><span class="tile-label">RAM</span><span class="tile-value" id="t-mem">–</span></div>
    <div class="tile"><span class="tile-label">Home</span><span class="tile-value" id="t-home">–</span></div>
    <div class="tile"><span class="tile-label">Printer</span><span class="tile-value" id="t-printer">–</span></div>
  </section>

  <main id="chat"></main>

  <footer>
    <button id="mic" class="mic" title="Hold or tap to talk">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
      </svg>
    </button>
    <input id="input" type="text" placeholder="Type or tap the mic…" autocomplete="off">
    <button id="send" title="Send">➤</button>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
